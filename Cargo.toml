[package]
name = "rust_test"
version = "0.1.0"
edition = "2021"

[dependencies]
git2 = "0.19"
anyhow = "1.0"
globset = "0.4"
walkdir = "2"
tempdir = "0.3"
regex = "1.10"
chrono = "0.4"
scopeguard = "1.2"
reqwest = "0.12"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
